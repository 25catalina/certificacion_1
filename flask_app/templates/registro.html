<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registro</title>
</head>
<body>

{% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p>{{ message }}</p>
      {% endfor %}
    {% endwith %}

            <h2>Registro</h2>
            <form action="/crear_usuario" method="POST">
                <label for="nombre_registro">Nombre:</label> <!-- el label es para darle un nombre al input -->
                <input type="text" id="nombre_registro" name="nombre" required><br><br>

                <label for="apellido_registro">Apellido:</label>
                <input type="text" id="apellido_registro" name="apellido" required><br><br>

                <label for="email_usuario_registro">E-mail:</label>
                <input type="email" id="email_usuario_registro" name="email" required><br><br>

                <label for="password_usuario_registro">Password:</label>
                <input type="password" id="password_usuario_registro" name="password" required><br><br>

                <label for="password_usuario_registro_confirm">Conf. Password:</label>
                <input type="password" id="password_usuario_registro_confirm" name="confirm_password" required><br><br>

                <input type="submit" value="Registrarme">
            </form>


        <!-- INICIO DE SESIÓN -->
        <div>
            <h2>Inicio de Sesión</h2>
            <form action="/iniciar_sesion" method="POST">
                <label for="inicio_sesion">E-mail:</label>
                <input type="email" id="inicio_sesion" name="email" required><br><br>

                <label for="password_inicio_sesion">Password:</label>
                <input type="password" id="password_inicio_sesion" name="password" required>
                <br><br>

                <input type="submit" value="Entrar">
            </form>
        </div>
    </div>
</body>
</html>
